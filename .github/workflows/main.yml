name: Build, Push, and Deploy to Azure Container Apps

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t java-app ./Springboot-application-docker

      # Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Push the Docker image to ACR
      - name: Push Docker Image to ACR
        run: |
          docker tag java-app ${{ secrets.ACR_LOGIN_SERVER }}/java-app:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/java-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Log in to Azure using service principal
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          az acr login --name myjavaappregistrysamp
          az containerapp list --resource-group ${{ secrets.RESOURCE_GROUP }} --output table
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image myjavaappregistrysamp.azurecr.io/java-app:latest



            
