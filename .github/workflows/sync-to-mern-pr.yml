name: Sync Source to MERN Repo and Create PR

on:
  push:
    branches:
      - source  # Only trigger when pushing to 'source' branch in SPRINGBOOT repo

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest

    env:
      DEST_REPO: Rewanshi/Containerized-MERN-STACK-TODOAPP  # Replace with your GitHub username
      DEST_BRANCH: destination
      TEMP_BRANCH: sync-from-source

    steps:
      - name: Checkout SPRINGBOOT repo (source)
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone MERN repo (destination)
        run: |
          git clone https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ env.DEST_REPO }} dest-repo
          cd dest-repo
          git checkout ${{ env.DEST_BRANCH }}
          git checkout -b ${{ env.TEMP_BRANCH }}

                         - name: Sync files to MERN repo
            run: |
              cd dest-repo
              git checkout ${{ env.DEST_BRANCH }}
              git checkout -b ${{ env.TEMP_BRANCH }}
          
              # Ensure we pull the latest changes from the remote branch (using --rebase)
              git fetch origin ${{ env.TEMP_BRANCH }} # Make sure we have the latest updates
              git rebase origin/${{ env.TEMP_BRANCH }}
          
              # Sync files from source repo to destination repo
              rsync -av --exclude='.git' --exclude='.github/workflows/**' ../. .
          
              git add .
              git commit -m "Sync changes from Containerized-SPRINGBOOT-APPLICATION (source branch)" || echo "No changes to commit"
          
              # Push changes to remote temp branch
              git push origin ${{ env.TEMP_BRANCH }}


      - name: Create Pull Request from cloned MERN repo
        working-directory: dest-repo
        run: |
            gh pr create \
            --base ${{ env.DEST_BRANCH }} \
            --head ${{ env.TEMP_BRANCH }} \
            --title "Sync changes from SPRINGBOOT (source) to MERN (destination)" \
            --body "This PR includes updates from the source branch of Containerized-SPRINGBOOT-APPLICATION."
            env:
             GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

            




          
