name: Sync to MERN Repo

on:
  push:
    branches:
      - source

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      DEST_REPO: Rewanshi/Containerized-MERN-STACK-TODOAPP
      SOURCE_BRANCH: source
      DEST_BRANCH: destination

    steps:
      - name: Checkout Source Repo (SPRINGBOOT)
        uses: actions/checkout@v3
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Destination Repo (MERN)
        run: |
          git clone https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ env.DEST_REPO }} dest-repo
          cd dest-repo
          git checkout ${{ env.DEST_BRANCH }}
          rsync -av --exclude='.git' --exclude='.github/workflows/**' ../ ./  # Copy from source repo to dest
          git add .
          git commit -m "Sync changes from source branch in SPRINGBOOT repo" || echo "No changes to commit"
          git push origin ${{ env.DEST_BRANCH }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: dest-repo
          title: "Sync changes from SPRINGBOOT:source to MERN:destination"
          body: "Automated sync triggered by changes in the source repo."
          base: ${{ env.DEST_BRANCH }}
          branch: ${{ env.DEST_BRANCH }}


            




          
