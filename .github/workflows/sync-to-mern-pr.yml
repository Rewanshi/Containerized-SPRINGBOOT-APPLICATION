name: Sync to destination Repo and Create PR

on:
  push:
    branches:
      - ${{ env.SOURCE_BRANCH }}
  schedule:
    # Runs at midnight on Jan 1, Apr 1, Jul 1, Oct 1
    - cron: '0 11 1 1,4,7,10 *'

env:
  SOURCE_BRANCH: new_source
  DEST_REPO: Rewanshi/Containerized-MERN-STACK-TODOAPP
  DEST_BRANCH: new_destination
  SYNC_BRANCH: sync-from-new-source

jobs:
  sync_and_raise_PR:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Destination Repo
        run: |
          git clone https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ env.DEST_REPO }} dest-repo
          cd dest-repo
          git checkout ${{ env.DEST_BRANCH }}
          git checkout -B ${{ env.SYNC_BRANCH }}
          rsync -av --delete --exclude='.git' --exclude='.github/workflows/**' ../ ./ || true
          git add .
          git commit -m "Sync changes from ${{ env.SOURCE_BRANCH }} → ${{ env.DEST_BRANCH }}" || echo "No changes to commit"
          git push -f origin ${{ env.SYNC_BRANCH }}

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Create Pull Request
        run: |
          gh pr create \
            -R ${{ env.DEST_REPO }} \
            -B ${{ env.DEST_BRANCH }} \
            -H ${{ env.SYNC_BRANCH }} \
            --title "Sync: ${{ env.SOURCE_BRANCH }} → ${{ env.DEST_BRANCH }}" \
            --body "Automated PR created by GitHub Actions to sync changes."
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}



