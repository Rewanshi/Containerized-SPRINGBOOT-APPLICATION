name: Sync to MERN Repo and Create PR

on:
  push:
    branches:
      - new_source

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      DEST_REPO: Rewanshi/Containerized-MERN-STACK-TODOAPP
      DEST_BRANCH: new_destination
      SYNC_BRANCH: new_source

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ env.SYNC_BRANCH }}

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Destination Repo
        run: |
          git clone https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ env.DEST_REPO }} dest-repo
          cd dest-repo
          git checkout ${{ env.DEST_BRANCH }}

          # Create or update the SYNC_BRANCH inside Repo B
          git checkout -B ${{ env.SYNC_BRANCH }}

          # Sync files (ignore .git and workflows)
          rsync -av --delete --exclude='.git' --exclude='.github/workflows/**' ../ ./ || true

          git add .
          git commit -m "Sync changes from new_source → new_destination" || echo "No changes to commit"

          git push -u origin ${{ env.SYNC_BRANCH }}

      - name: Install GitHub CLI
        run: sudo apt-get install gh

      - name: Create Pull Request
        run: |
          gh pr create -R ${{ env.DEST_REPO }} \
            -B ${{ env.DEST_BRANCH }} \
            -H ${{ env.SYNC_BRANCH }} \
            --title "Automated Sync PR: new_source → new_destination" \
            --body "This PR was automatically created by the GitHub Action to sync changes."

        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}




        
